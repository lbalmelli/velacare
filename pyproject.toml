[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "velacare-evolution-engine"
version = "1.0.0"
description = "Reproducible genetic feature-selection research demo for VelaCare"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24,<3",
  "scikit-learn>=1.2,<2",
  "rich>=13,<15",
]

[project.optional-dependencies]
dashboard = [
  "dash>=2.18,<4",
  "plotly>=5.24,<7",
]
report = [
  "matplotlib>=3.8,<4",
  "python-pptx>=1.0,<2",
]

[project.scripts]
velacare-evolution = "velacare.cli:main"
velacare-dashboard = "velacare.dashboard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"velacare.dashboard" = ["assets/*.css", "assets/*.png", "pwa/*", "pwa/icons/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = ["pytest>=7.2,<9"]
